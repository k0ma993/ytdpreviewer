name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Build
        shell: cmd
        env:
          CI: "1"
        run: build.bat

      - name: Prepare release notes
        shell: pwsh
        run: |
          $currentTag = "${{ github.ref_name }}"
          $previousTag = git tag --sort=-version:refname |
            Where-Object { $_ -ne $currentTag } |
            Select-Object -First 1

          @(
            "## Что изменилось"
            ""
            if ($previousTag) {
              git log "$previousTag..HEAD" --pretty=format:"- %s" --invert-grep --grep="^Release "
              ""
              ""
              "Полный список: https://github.com/${{ github.repository }}/compare/$previousTag...$currentTag"
            } else {
              "- Первый публичный релиз"
            }
          ) | Set-Content -Path release_notes.md -Encoding utf8

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/app_bundle.zip
            dist/setup.zip
          body_path: release_notes.md
